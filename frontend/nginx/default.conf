# Nginx тестового окружения:
#   /        собранный фронт (React), для маршрутов SPA отдаётся index.html
#   /api/    проксируется на FastAPI (backend:8000) во внутренней сети
#   /healthz проверка самого Nginx для healthcheck контейнера

# Не показывать версию Nginx в заголовках и страницах ошибок
server_tokens off;

# DNS Docker. Имя backend перечитывается каждые 10 с, поэтому после
# перезапуска backend (новый IP) Nginx не продолжает стучаться по старому адресу.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы приложения маленькие: формы входа, регистрации, корзины
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Если backend лежит, фронт получает тот же формат ошибки, что и от API
        proxy_intercept_errors off;
        error_page 502 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 503 '{"detail": "Сервер временно недоступен, попробуйте позже"}';
    }

    # Файлы сборки Vite с хэшем в имени: можно кэшировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Маршруты React Router (/cart, /login, /product/2): при обновлении
    # страницы отдаём index.html, а не 404
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
