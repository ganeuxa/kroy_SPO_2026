# Сгенерировано build_openapi.py, правьте stage3-paths.yaml
openapi: 3.1.0
info:
  title: Крой API
  version: 0.4.0
  description: 'Актуальный контракт FastAPI для учебного интернет-магазина одежды «Крой». Схема собирается из runtime API;
    stage3-paths.yaml добавляет русские пояснения.


    Общие правила: ошибки — `{"detail": "..."}`, ошибки валидации (422) — формат FastAPI; суммы — строки с двумя знаками;
    даты — ISO 8601 с часовым поясом; списки — `{items, total, limit, offset}`. Защищённые методы требуют `Authorization:
    Bearer <токен>`; методы `/api/admin/*` без токена отвечают 401, покупателю — 403 (NFR-04).'
paths:
  /api/health:
    get:
      tags:
      - service
      summary: Состояние API, БД и версия релиза
      description: Жив ли сервер и есть ли связь с БД. Используется в healthcheck контейнера.
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/products:
    get:
      tags:
      - catalog
      summary: Каталог с фильтрами, поиском и страницами
      operationId: list_products_api_products_get
      parameters:
      - name: gender
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - men
            - women
            - unisex
            type: string
          - type: 'null'
          title: Gender
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          description: slug категории
          title: Category
        description: slug категории
      - name: size
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Size
      - name: color
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Color
      - name: price_min
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Price Min
      - name: price_max
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Price Max
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 100
          - type: 'null'
          description: поиск по названию
          title: Q
        description: поиск по названию
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - new
          - price_asc
          - price_desc
          type: string
          default: new
          title: Sort
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 24
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
  /api/products/{product_id}:
    get:
      tags:
      - catalog
      summary: Карточка товара с вариантами
      operationId: get_product_api_products__product_id__get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
  /api/filters:
    get:
      tags:
      - catalog
      summary: Значения для фильтров каталога
      description: 'Значения для фильтров каталога: берутся из видимых товаров.'
      operationId: get_filters_api_filters_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filters'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Регистрация, сразу возвращает токен
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Вход по email и паролю
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь по токену
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Завершить все сеансы пользователя
      description: Отзывает все ранее выданные токены. Повтор со старым токеном возвращает 401.
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/cart:
    get:
      tags:
      - cart
      summary: Корзина текущего пользователя
      operationId: get_cart_api_cart_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
    post:
      tags:
      - cart
      summary: Добавить вариант товара в корзину
      description: Добавляет вариант товара в корзину. Если он уже там, увеличивает количество.
      operationId: add_to_cart_api_cart_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
      security:
      - HTTPBearer: []
  /api/cart/items/{item_id}:
    patch:
      tags:
      - cart
      summary: Изменить количество позиции в корзине
      description: Задаёт количество позиции целиком (не прибавляет). Больше остатка нельзя.
      operationId: update_cart_item_api_cart_items__item_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateIn'
            examples:
              default:
                value:
                  quantity: 3
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
    delete:
      tags:
      - cart
      summary: Удалить позицию из корзины
      operationId: delete_cart_item_api_cart_items__item_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
      description: FR-07. Чужая или несуществующая позиция — 404.
  /api/pickup-points:
    get:
      tags:
      - orders
      summary: Пункты выдачи для самовывоза
      operationId: list_pickup_points_api_pickup_points_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PickupPointOut'
                type: array
                title: Response List Pickup Points Api Pickup Points Get
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /api/orders:
    post:
      tags:
      - orders
      summary: Оформить заказ из корзины
      description: 'Одна транзакция: списать остатки, создать заказ со сроком оплаты, очистить корзину.

        Повтор с тем же Idempotency-Key возвращает уже созданный заказ с кодом 200.'
      operationId: create_order_api_orders_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateIn'
            examples:
              courier:
                summary: Курьер
                value:
                  delivery_method: courier
                  delivery_address: Москва, ул. Тверская, д. 10, кв. 5
                  contact_phone: '+79001112233'
                  comment: Позвонить за час
              pickup:
                summary: Самовывоз
                value:
                  delivery_method: pickup
                  pickup_point_id: 1
                  contact_phone: '+79001112233'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
    get:
      tags:
      - orders
      summary: История заказов покупателя
      operationId: list_my_orders_api_orders_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - new
            - paid
            - shipped
            - delivered
            - cancelled
            type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Требуется действующий токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      description: FR-10. Только заказы текущего пользователя, новые сверху.
  /api/orders/{order_id}:
    get:
      tags:
      - orders
      summary: Заказ покупателя с составом, платежами и историей статусов
      operationId: get_my_order_api_orders__order_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Требуется действующий токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      description: FR-10. Чужой заказ — 404, а не 403, чтобы нельзя было перебором узнать, какие номера существуют.
  /api/orders/{order_id}/cancel:
    post:
      tags:
      - orders
      summary: Отменить неоплаченный заказ
      operationId: cancel_my_order_api_orders__order_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Требуется действующий токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      description: Только статус `new`. Списанный под заказ остаток возвращается на склад.
  /api/orders/{order_id}/payments:
    post:
      tags:
      - payments
      summary: Начать оплату заказа
      operationId: create_payment_api_orders__order_id__payments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Order Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOut'
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOut'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
          description: Conflict
        '422':
          description: Ошибка полей или бизнес-валидации
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorOut'
        '401':
          description: Требуется действующий токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      description: 'FR-09, NFR-09. Создаёт платёж `pending` и возвращает `confirmation_url` — страницу платёжного

        сервиса, где покупатель вводит карту. Номер карты на наш сервер не приходит.

        `Idempotency-Key` обязателен: повтор с тем же ключом возвращает тот же платёж с кодом 200.

        '
  /api/payments/{payment_id}:
    get:
      tags:
      - payments
      summary: Статус платежа
      operationId: get_payment_api_payments__payment_id__get
      security:
      - HTTPBearer: []
