# Окружение для разработки: БД, сервер и фронт с горячей перезагрузкой.
# Тестовое окружение с Nginx и сборкой фронта — задача №7.
name: kroy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KROY_APP_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты выполняются только при первом создании тома pgdata
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      # Только с этой машины: для psql/DBeaver при разработке
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Одноразовый: применяет db/migrations от владельца схемы и завершается.
  # У kroy_app прав на изменение схемы нет.
  migrate:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: python -m app.migrate
    volumes:
      - ./backend/app:/app/app
      - ./db/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Хранилище фото с S3 API (SeaweedFS вместо MinIO: образы MinIO больше не публикуются).
  # Наружу не открыто: фото отдаёт Vite (здесь) или Nginx (тестовое окружение) по /media/
  storage:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Задайте MINIO_ACCESS_KEY в .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Задайте MINIO_SECRET_KEY в .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-kroy-products}
    volumes:
      - ./storage/start.sh:/start.sh:ro
      - media:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: kroy_app
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      ORDER_PAYMENT_TTL_MINUTES: ${ORDER_PAYMENT_TTL_MINUTES:-15}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-test}
      # Хранилище фото (S3 API, сервис storage)
      MINIO_ENDPOINT: storage:8333
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Задайте MINIO_ACCESS_KEY в .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Задайте MINIO_SECRET_KEY в .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-kroy-products}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_MEDIA_TARGET: http://storage:8333
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
